    doLast {
        println "==================================================="
        println " Triple-Layer Protected jar (Mobile):"
        println "  ${finalDir}/${project.name}-obf-mobile.jar"
        println "==================================================="
        println " Layer 1: ProGuard (name obfuscation)"
        println " Layer 2: J2CC    (native → aarch64-linux-musl)"
