}

// ====================================================================
//  同时构建桌面端 + 移动端
//  执行：gradlew buildAllProtectedJars
// ====================================================================
task buildAllProtectedJars {
    dependsOn buildProtectedJar, buildMobileProtectedJar

    doLast {
        def finalDir = file("${buildDir}/libs/protected")
        println ""
        println "==================================================="
        println " All platforms built successfully!"
        println "  Windows: ${finalDir}/${project.name}-obf.jar"
        println "  Android: ${finalDir}/${project.name}-obf-mobile.jar"
        println "==================================================="
    }
}