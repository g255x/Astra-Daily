# ============================================================
#  KBox 配置文件（properties 格式）
#  Fabric Mixin 兼容性优化 + J2CC 兼容
# ============================================================

# ===== 【关键】禁止 KBox 做名称混淆 =====
# ProGuard 已做名称混淆，KBox 再混淆会破坏 J2CC 的方法引用
dontobfuscate = true
rename = false

# ===== 控制流混淆 =====
controlFlowFlattening = true
flattenerLevel = 2
flattenerMinInsns = 32
flattenerMaxInsns = 128

# ===== 字符串加密 =====
stringEncryption = true
stringEncryptionStrength = 2

# ===== 反编译器对抗 =====
antiDecompiler = true
antiDecompilerLevel = 2

# ===== 关闭与 Fabric 冲突的功能 =====
vmp = false
jnic = false
encryptClasses = false
resourceObfuscation = false

# ===== 保留类（斜杠格式） =====
keepClasses = dev/Astra/asm/mixins/**
keepClasses = dev/Astra/asm/accessors/**
keepClasses = dev/Astra/asm/**
keepClasses = dev/Astra/api/events/**
keepClasses = dev/Astra/mod/gui/**
keepClasses = j2cc/**