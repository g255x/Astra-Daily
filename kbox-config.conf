# ===== KBox 核心配置 =====
# 一键全开最大强度（会自动适配项目类型）
allMax = true

# === 必须排除的包（Fabric Mixin 和事件系统）===
keepPrefix = dev.Astra.asm.mixins.**, dev.Astra.asm.accessors.**, dev.Astra.api.events.**
keepPrefix = dev.Astra.mod.gui.clickgui.**

# === 保留 J2CC 注解方法（避免冲突）===
keepPrefix = @j2cc.Nativeify

# === 保留属性和注解 ===
keepAttributes = RuntimeVisibleAnnotations, RuntimeInvisibleAnnotations, InnerClasses, EnclosingMethod, Signature, Exceptions

# === 入口点（必填）===
entryPoint = dev.Astra.Astra